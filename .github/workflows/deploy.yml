name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            wsl.exe -- bash -lc "set -e; cd /mnt/c/Users/admin/joonspace/veloo.page; git pull --ff-only origin main; docker compose up -d --build --remove-orphans; docker compose ps; sudo nginx -t; sudo systemctl reload nginx; curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors --output /dev/null https://veloo.page"
