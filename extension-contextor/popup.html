<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Contextor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #ffffff;
      --card:   #f2f2f2;
      --border: #e5e5e5;
      --text:   #0f0f0f;
      --sub:    #606060;
      --muted:  #909090;
      --sel-bg: #0f0f0f;
      --sel-tx: #ffffff;
    }

    body {
      width: 400px;
      min-height: 120px;
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    /* Header */
    .header {
      background: var(--bg);
      padding: 11px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    .header .wordmark  { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
    .header .sep       { font-size: 14px; color: var(--muted); margin: 0 2px; }
    .header .page-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .header .open-web  {
      margin-left: auto;
      font-size: 0.74rem;
      color: var(--sub);
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      font-family: inherit;
    }

    /* Search bar */
    .search-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    #queryInput {
      flex: 1;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: var(--card);
      outline: none;
      transition: border-color 0.15s;
    }
    #queryInput:focus { border-color: var(--text); background: #fff; }
    #queryInput::placeholder { color: var(--muted); }

    #lookupBtn {
      height: 34px;
      padding: 0 16px;
      border: none;
      border-radius: 8px;
      background: var(--sel-bg);
      color: var(--sel-tx);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    #lookupBtn:hover { opacity: 0.82; }
    #lookupBtn:disabled { opacity: 0.4; cursor: default; }

    /* Status */
    #status {
      padding: 20px 16px;
      font-size: 0.84rem;
      color: var(--muted);
      text-align: center;
      display: none;
    }
    #status.visible { display: block; }
    #status.error   { color: #c0392b; }

    /* Result */
    #result { display: none; padding: 12px 16px 20px; }

    .result-query {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .no-ml {
      padding: 14px;
      background: var(--card);
      border-radius: 8px;
      font-size: 0.86rem;
      color: var(--sub);
      line-height: 1.6;
    }

    .case-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .case-item:last-child { border-bottom: none; }

    .case-label {
      display: inline-block;
      padding: 2px 9px;
      background: var(--sel-bg);
      color: var(--sel-tx);
      border-radius: 20px;
      font-size: 0.74rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .case-term    { font-size: 0.82rem; font-weight: 700; color: var(--text); margin-bottom: 3px; }
    .case-meaning { font-size: 0.88rem; color: var(--sub); line-height: 1.6; margin-bottom: 8px; }

    .case-example {
      background: var(--card);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 0.8rem;
      color: var(--sub);
      line-height: 1.6;
    }
    .case-example .en { color: var(--text); font-style: italic; margin-bottom: 2px; }
    .case-example .ko { color: var(--muted); }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 13px; height: 13px;
      border: 2px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-left: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="header">
    <span class="wordmark">Veloo</span>
    <span class="sep">›</span>
    <span class="page-name">맥락기</span>
    <button class="open-web" id="openWeb">웹에서 열기 ↗</button>
  </div>

  <div class="search-row">
    <input id="queryInput" type="text" placeholder="단어 또는 짧은 구 입력" autocomplete="off" />
    <button id="lookupBtn">조회</button>
  </div>

  <div id="status"></div>
  <div id="result"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
