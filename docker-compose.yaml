services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: veloo:local
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PORT:-9000}:${PORT:-9000}"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          urllib.request.urlopen(
            'http://127.0.0.1:' + os.getenv('PORT', '9000') + '/',
            timeout=5
          )
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s